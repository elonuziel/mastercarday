name: Scrape Mastercard Day Catalog

on:
  workflow_dispatch: # Allows manual trigger from the GitHub "Actions" tab
  schedule:
    # Runs automatically every Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
    # Runs automatically on the 8th, 9th, 10th, and 11th of each month at 06:00 UTC
    - cron: '0 6 8,9,10,11 * *'

permissions:
  contents: write # Allows committing updated deals.json and deals.csv

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Mastercard Day Scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scraper.py

      - name: Commit and push updated catalog locally
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/deals.csv
          if git diff --staged --quiet; then
            echo "No changes in Mastercard Day catalog."
          else
            git commit -m "Automated update of Mastercard Day catalog [skip ci]"
            git push
          fi

      - name: Checkout Master Repo (Behatsdaa-site-ai-mesh)
        uses: actions/checkout@v4
        with:
          repository: 'elonuziel/Behatsdaa-site-ai-mesh'
          token: ${{ secrets.MASTER_REPO_PAT }}
          path: 'master-repo'
          ref: 'main'

      - name: Push Updated Mastercard Day Deals to Master Repo
        run: |
          mkdir -p master-repo/data/sources/mastercard
          cp data/deals.json master-repo/data/sources/mastercard/deals.json

          cd master-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet data/sources/mastercard/; then
            echo "No changes in Mastercard Day deals for master repo."
          else
            echo "Pushing updated Mastercard Day deals to master repo..."
            git add data/sources/mastercard/
            git commit -m "chore(data): auto-sync latest Mastercard Day deals from scraper"
            git push origin main
            echo "Successfully pushed to master repo!"
          fi
